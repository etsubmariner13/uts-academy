site_name: Unified Tensile System Academy
site_url: https://academy.unifiedtensilesystem.org
site_description: An independent, scale-invariant autodidactic curriculum and research repository anchored at coordinate (0,0,0).
site_author: Kenneth Pfaff

repo_name: uts-academy
repo_url: https://github.com/etsubmariner13/uts-academy

theme:
  name: material
  language: en
  font:
    text: Lato
    code: Roboto Mono
  palette:
    - scheme: default
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: slate
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/matrix-tracker.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: false
      clickable_checkbox: true
  - attr_list
  - md_in_html
  - tables

nav:
  - UTS Main Site: https://unifiedtensilesystem.org
  - Positions: https://www.unifiedtensilesystem.org/positions
  - Stoa Rebuilt: https://www.unifiedtensilesystem.org/stoa-rebuilt
  - Curriculum ToC: https://docs.google.com/document/d/1_iBT70xpHc1QosazgvnZtKgzKETRuz4piazbSwwHUT8/edit?usp=drive_link
  - Curriculum-on-Drive: https://drive.google.com/drive/folders/1x8LtVAJudu0UaZEP3b9dZ4z7ts7mLp7e?usp=drive_link
  - Academy Curriculum:
      - Academy Entrance: index.md
      - Level 0 Onboarding "Grounding":
          - "Overview & Foundation": level-0/index.md
          - "Module 0-1 Letting Go": level-0/module-0-1.md
          - "Module 0-2 Clearing Out The Jargon": level-0/module-0-2.md
          - "Module 0-3 The Grid": level-0/module-0-3.md
          - "Module 0-4 Managing Your Mental Space": level-0/module-0-4.md
          - "Module 0-5 Motion As Re-Folding": level-0/module-0-5.md
          - "Module 0-6 Preparing For The Wire": level-0/module-0-6.md
          - "Module 0 Introduction to Panels": level-0/panel-0.md
      - Level 1 Novice:
          - "Overview & Clearing the Canvas": level-1/index.md
          - "Module 1.1 The Material Wire": level-1/module-1-1.md
          - "Module 1.2 Helical Configuration": level-1/module-1-2.md
          - "Module 1.3 The Boundary Layer": level-1/module-1-3.md
          - "Module 1.4 Master Equivalence Anchor": level-1/module-1-4.md
          - "Module 1.5 Micro-Froth Slop Buffer": level-1/module-1-5.md
          - "Module 1.6 Non-Deformable Node": level-1/module-1-6.md
          - "Module 1.7 Macro-Loop Closure": level-1/module-1-7.md
          - "Module 1 Capstone Panel": level-1/panel-1.md
      - Level 2 Planar Dynamics "Intermediate":
          - "Overview & 2D Mechanics": level-2/index.md
          - "Module 2.1 The Planar Drawing Engine": level-2/module-2-1.md
          - "Module 2.2 Sentence Postures": level-2/module-2-2.md
          - "Module 2.3 Verification Hysteresis Audit": level-2/module-2-3.md
          - "Module 2.4 Bracketed Substrate Naturalization": level-2/module-2-4.md
          - "Module 2.5 Invariant Arc Length": level-2/module-2-5.md
          - "Module 2.6 Reciprocal Unzipping Cycle": level-2/module-2-6.md
          - "Module 2 Capstone Panel": level-2/panel-2.md
      - Level 3 Spherical Synthesis "Advanced":
          - "Overview & 3D Compaction": level-3/index.md
      - Level 4 Deep-Time Mastery "Expert":
          - "Overview & Crown Closure": level-4/index.md
      - Omni-Disciplinary Sciences "Mastery":
          - "UTS As-Is": omni-discipline/index.md
          - "Example post-Curriculum Panel 1": omni-discipline/index2.md
          - "Example post-Curriculum Panel 2": omni-discipline/index3.md
          - "Example post-Curriculum Panel 3": omni-discipline/index4.md
          - "Example post-Curriculum Panel 4": omni-discipline/index5.md